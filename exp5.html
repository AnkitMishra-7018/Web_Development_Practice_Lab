<!--Registration Page-->
<!DOCTYPE html>
<html>

<head>
    <title>Registration Page</title>
</head>

<body>

    <table border="1" width="100%" cellpadding="8" cellspacing="0">

        <!-- Row 1: Logo and WebSite Name -->
        <tr bgcolor="#FAC090">
            <td width="15%" align="center"><img src="logo.png" alt="logo" height="75" width="100"></td>
            <td colspan="4" align="center">Online Book Store</td>
        </tr>

        <!-- Row 2: Navigation menu -->
        <tr bgcolor="#FDE9D9">
            <td align="center"><a href="index.html">Home</a></td>
            <td align="center"><a href="login.html">Login</a></td>
            <td align="center"><a href="registration.html">Registration</a></td>
            <td align="center"><a href="#">Catalogue</a></td>
            <td align="center"><a href="#">Cart</a></td>
        </tr>

        <!-- Row 3: Side menu and registration form -->
        <tr>
            <td valign="top">
                <a href="#">CSE</a><br><br><br>
                <a href="#">ECE</a><br><br><br>
                <a href="#">EEE</a><br><br><br>
                <a href="#">CIVIL</a>
            </td>
            <td colspan="4" align="center" valign="top">

                <form action="#" method="post">
                    <table border="0" cellpadding="8" cellspacing="0">

                        <tr bgcolor="#FDE9D9">
                            <td colspan="2" align="center"><b>REGISTRATION PAGE</b></td>
                        </tr>

                        <!-- 1) Name -->
                        <tr>
                            <td>Name:</td>
                            <td><input type="text" name="name" size="25"></td>
                        </tr>

                        <!-- 2) Password -->
                        <tr>
                            <td>Password:</td>
                            <td><input type="password" name="password" size="25"></td>
                        </tr>

                        <!-- 3) E-mail id -->
                        <tr>
                            <td>E-mail id:</td>
                            <td><input type="text" name="email" size="25"></td>
                        </tr>

                        <!-- 4) Phone Number -->
                        <tr>
                            <td>Phone Number:</td>
                            <td><input type="text" name="phone" size="25"></td>
                        </tr>

                        <!-- 5) Sex (radio buttons) -->
                        <tr>
                            <td>Sex:</td>
                            <td>
                                <input type="radio" name="sex" value="male"> Male
                                <input type="radio" name="sex" value="female"> Female
                                <input type="radio" name="sex" value="other"> Other
                            </td>
                        </tr>

                        <!-- 6) Date of birth (3 select boxes) -->
                        <tr>
                            <td>Date of Birth:</td>
                            <td>
                                <select name="day">
                                    <option value="">Day</option>
                                    <option>1</option>
                                    <option>2</option>
                                    <option>3</option>
                                    <option>4</option>
                                    <option>5</option>
                                    <option>6</option>
                                    <option>7</option>
                                    <option>8</option>
                                    <option>9</option>
                                    <option>10</option>
                                    <option>11</option>
                                    <option>12</option>
                                    <option>13</option>
                                    <option>14</option>
                                    <option>15</option>
                                    <option>16</option>
                                    <option>17</option>
                                    <option>18</option>
                                    <option>19</option>
                                    <option>20</option>
                                    <option>21</option>
                                    <option>22</option>
                                    <option>23</option>
                                    <option>24</option>
                                    <option>25</option>
                                    <option>26</option>
                                    <option>27</option>
                                    <option>28</option>
                                    <option>29</option>
                                    <option>30</option>
                                    <option>31</option>
                                </select>
                                <select name="month">
                                    <option value="">Month</option>
                                    <option>January</option>
                                    <option>February</option>
                                    <option>March</option>
                                    <option>April</option>
                                    <option>May</option>
                                    <option>June</option>
                                    <option>July</option>
                                    <option>August</option>
                                    <option>September</option>
                                    <option>October</option>
                                    <option>November</option>
                                    <option>December</option>
                                </select>
                                <select name="year">
                                    <option value="">Year</option>
                                    <option>2030</option>
                                    <option>2029</option>
                                    <option>2028</option>
                                    <option>2027</option>
                                    <option>2026</option>
                                    <option>2025</option>
                                    <option>2024</option>
                                    <option>2023</option>
                                    <option>2022</option>
                                    <option>2021</option>
                                    <option>2020</option>
                                    <option>2019</option>
                                    <option>2018</option>
                                    <option>2017</option>
                                    <option>2016</option>
                                    <option>2015</option>
                                    <option>2014</option>
                                    <option>2013</option>
                                    <option>2012</option>
                                    <option>2011</option>
                                    <option>2010</option>
                                    <option>2009</option>
                                    <option>2008</option>
                                    <option>2007</option>
                                    <option>2006</option>
                                    <option>2005</option>
                                    <option>2004</option>
                                    <option>2003</option>
                                    <option>2002</option>
                                    <option>2001</option>
                                    <option>2000</option>
                                    <option>1999</option>
                                    <option>1998</option>
                                    <option>1997</option>
                                    <option>1996</option>
                                    <option>1995</option>
                                    <option>1994</option>
                                    <option>1993</option>
                                    <option>1992</option>
                                    <option>1991</option>
                                    <option>1990</option>
                                </select>
                            </td>
                        </tr>

                        <!-- 7) Languages known (checkboxes) -->
                        <tr>
                            <td valign="top">Languages Known:</td>
                            <td>
                                <input type="checkbox" name="lang" value="English"> English
                                <input type="checkbox" name="lang" value="Telugu"> Telugu
                                <input type="checkbox" name="lang" value="Hindi"> Hindi
                                <input type="checkbox" name="lang" value="Tamil"> Tamil
                            </td>
                        </tr>

                        <!-- 8) Address (text area) -->
                        <tr>
                            <td valign="top">Address:</td>
                            <td><textarea name="address" rows="4" cols="30"></textarea></td>
                        </tr>

                        <!-- Buttons -->
                        <tr>
                            <td colspan="2" align="center">
                                <button type="submit">
                                    <font color="#C00000">Submit</font>
                                </button>
                                &nbsp;&nbsp;&nbsp;&nbsp;
                                <button type="reset">
                                    <font color="#C00000">Reset</font>
                                </button>
                            </td>
                        </tr>

                    </table>
                </form>

            </td>
        </tr>

    </table>

</body>

</html>
